<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Receipt Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f4;
      --panel-bg: #ffffff;
      --accent-color: #6b7c6b;
      --text-color: #2c352c;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* Control Panel */
    .controls-panel {
      background: var(--panel-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 340px;
    }

    .controls-panel h2 {
      margin-top: 0;
      color: var(--accent-color);
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .item-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }

    .item-row input[type="text"] { flex: 2; }
    .item-row input[type="number"] { flex: 1; }

    .btn-delete {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button.btn-main {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    button.btn-secondary {
      background: #e2e8e2;
      color: var(--text-color);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 5px;
    }

    /* Receipt Frame - Scaled precisely to template ratio */
    .receipt-ticket {
      width: 360px;
      height: 640px;
      background-color: #fff;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      font-family: 'Courier New', Courier, monospace;
      color: #3b473b;
      position: relative;
      box-sizing: border-box;
    }

    /* Absolute Placement Overlay Areas */
    .overlay-header {
      position: absolute;
      top: 165px;
      left: 55px;
      right: 55px;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .overlay-body {
      position: absolute;
      top: 215px;
      left: 45px;
      right: 45px;
      height: 250px;
      overflow: hidden;
    }

    .receipt-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .receipt-table td {
      padding: 4px 0;
    }

    .receipt-table .num {
      text-align: right;
    }

    .overlay-total {
      position: absolute;
      bottom: 145px;
      right: 55px;
      font-size: 1.05rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="controls-panel">
    <h2>🌲 Receipt Generator</h2>
    
    <div class="form-group">
      <label>Order Number</label>
      <input type="text" id="orderNo" value="#1001" oninput="updateReceipt()">
    </div>
    
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="orderDate" oninput="updateReceipt()">
    </div>

    <div class="form-group">
      <label>Template Aesthetic</label>
      <select id="bgPicker" onchange="updateReceipt()">
        <option value="59928.jpg">Sage Bows & Gingham</option>
        <option value="59929.jpg">Coquette Pink Bows</option>
        <option value="59927.jpg">Doodle Star & Hearts</option>
      </select>
    </div>

    <div class="form-group">
      <label>Items</label>
      <div id="itemList">
        <div class="item-row">
          <input type="text" class="item-name" value="Jake Dog" placeholder="Item" oninput="updateReceipt()">
          <input type="number" class="item-qty" value="1" min="1" placeholder="Qty" oninput="updateReceipt()">
          <input type="number" class="item-price" value="7000" placeholder="Price" oninput="updateReceipt()">
          <button class="btn-delete" onclick="removeItemRow(this)">✕</button>
        </div>
      </div>
      <button class="btn-secondary" onclick="addItemRow()">+ Add Item</button>
    </div>

    <button class="btn-main" onclick="downloadReceipt()">Save High-Res Image</button>
  </div>

  <div class="receipt-ticket" id="receiptTicket">
    <div class="overlay-header">
      <span id="dispOrderNo">#1001</span>
      <span id="dispDate">2026-08-29</span>
    </div>

    <div class="overlay-body">
      <table class="receipt-table">
        <tbody id="dispItems">
        </tbody>
      </table>
    </div>

    <div class="overlay-total">
      <span id="dispTotal">0</span>
    </div>
  </div>

  <script>
    document.getElementById('orderDate').valueAsDate = new Date();

    function addItemRow() {
      const container = document.getElementById('itemList');
      const div = document.createElement('div');
      div.className = 'item-row';
      div.innerHTML = `
        <input type="text" class="item-name" placeholder="Item" oninput="updateReceipt()">
        <input type="number" class="item-qty" value="1" min="1" placeholder="Qty" oninput="updateReceipt()">
        <input type="number" class="item-price" placeholder="Price" oninput="updateReceipt()">
        <button class="btn-delete" onclick="removeItemRow(this)">✕</button>
      `;
      container.appendChild(div);
      updateReceipt();
    }

    function removeItemRow(btn) {
      btn.parentElement.remove();
      updateReceipt();
    }

    function updateReceipt() {
      const selectedBg = document.getElementById('bgPicker').value;
      const ticket = document.getElementById('receiptTicket');
      ticket.style.backgroundImage = `url('${selectedBg}')`;

      // Positional tweaking based on template structure
      const header = document.querySelector('.overlay-header');
      const body = document.querySelector('.overlay-body');
      const totalDisplay = document.querySelector('.overlay-total');

      if (selectedBg === '59927.jpg') {
        // Black and white doodle template adjustments
        header.style.top = '70px';
        body.style.top = '175px';
        totalDisplay.style.bottom = '195px';
      } else if (selectedBg === '59929.jpg') {
        // Pink bow template adjustments
        header.style.top = '150px';
        body.style.top = '210px';
        totalDisplay.style.bottom = '165px';
      } else {
        // Sage green template adjustments
        header.style.top = '168px';
        body.style.top = '220px';
        totalDisplay.style.bottom = '145px';
      }

      document.getElementById('dispOrderNo').innerText = document.getElementById('orderNo').value;
      document.getElementById('dispDate').innerText = document.getElementById('orderDate').value;

      const names = document.querySelectorAll('.item-name');
      const qtys = document.querySelectorAll('.item-qty');
      const prices = document.querySelectorAll('.item-price');
      
      const tbody = document.getElementById('dispItems');
      tbody.innerHTML = '';
      let total = 0;

      for (let i = 0; i < names.length; i++) {
        const name = names[i].value || '';
        const qty = parseInt(qtys[i].value) || 0;
        const price = parseFloat(prices[i].value) || 0;
        const lineTotal = qty * price;
        total += lineTotal;

        if (name) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="width: 50%;">${name}</td>
            <td class="num" style="width: 20%;">${qty}</td>
            <td class="num" style="width: 30%;">${lineTotal.toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        }
      }

      document.getElementById('dispTotal').innerText = total.toLocaleString();
    }

    function downloadReceipt() {
      const ticket = document.getElementById('receiptTicket');
      html2canvas(ticket, {
        useCORS: true,
        scale: 3
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `receipt-${document.getElementById('orderNo').value}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    updateReceipt();
  </script>
</body>
</html>
