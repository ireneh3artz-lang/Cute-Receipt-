<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Receipt Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #f0f4f1;
      --panel-bg: #ffffff;
      --accent-color: #6b8e6b;
      --text-color: #2d372d;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* Control Panel */
    .controls-panel {
      background: var(--panel-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 320px;
    }

    .controls-panel h2 {
      margin-top: 0;
      color: var(--accent-color);
      font-size: 1.3rem;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .item-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }

    .item-row input[type="text"] { flex: 2; }
    .item-row input[type="number"] { flex: 1; }

    .btn-delete {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button.btn-main {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    button.btn-secondary {
      background: #e2e8e2;
      color: var(--text-color);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 5px;
    }

    /* Outer Wrapper for Print Frame */
    .receipt-wrapper {
      padding: 15px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    /* Core Receipt Ticket Box */
    .receipt-ticket {
      width: 330px;
      min-height: 580px;
      padding: 25px;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    /* ---------------- DESIGN TEMPLATE 1: SAGE GINGHAM ---------------- */
    .theme-sage {
      background-color: #f4f7f4;
      background-image: 
        linear-gradient(90deg, rgba(107, 142, 107, 0.12) 50%, transparent 50%),
        linear-gradient(rgba(107, 142, 107, 0.12) 50%, transparent 50%);
      background-size: 20px 20px;
      border: 2px dashed #8ba88b;
      color: #384738;
    }
    .theme-sage .receipt-title { color: #527052; font-size: 1.4rem; text-align: center; font-weight: bold; }
    .theme-sage th { border-bottom: 2px dashed #8ba88b; }
    .theme-sage .receipt-total-box { border-top: 2px dashed #8ba88b; border-bottom: 2px dashed #8ba88b; }

    /* ---------------- DESIGN TEMPLATE 2: COQUETTE PINK ---------------- */
    .theme-pink {
      background-color: #fff8fa;
      border: 3px double #f3b0c3;
      color: #633843;
      background-image: radial-gradient(#f7d6e0 15%, transparent 16%);
      background-size: 18px 18px;
    }
    .theme-pink .receipt-title { color: #d87093; font-size: 1.4rem; text-align: center; font-weight: bold; }
    .theme-pink th { border-bottom: 2px solid #f3b0c3; }
    .theme-pink .receipt-total-box { border-top: 2px solid #f3b0c3; border-bottom: 2px solid #f3b0c3; }

    /* ---------------- DESIGN TEMPLATE 3: MONOCHROME DOODLE ---------------- */
    .theme-doodle {
      background-color: #ffffff;
      border: 2px solid #222222;
      box-shadow: 4px 4px 0px #222222;
      color: #111111;
    }
    .theme-doodle .receipt-title { color: #111111; font-size: 1.5rem; text-align: center; font-weight: bold; text-decoration: underline; }
    .theme-doodle th { border-bottom: 2px solid #222222; }
    .theme-doodle .receipt-total-box { border-top: 2px solid #222222; border-bottom: 2px solid #222222; }

    /* Shared Typography & Table Formatting */
    .receipt-header-info {
      font-size: 0.8rem;
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
    }

    .receipt-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-top: 10px;
    }

    .receipt-table th {
      padding-bottom: 6px;
      text-align: left;
    }

    .receipt-table td {
      padding: 6px 0;
    }

    .receipt-table .num { text-align: right; }

    .receipt-total-box {
      margin-top: 15px;
      padding: 8px 0;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 1rem;
    }

    .receipt-footer-text {
      text-align: center;
      font-size: 0.75rem;
      margin-top: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="controls-panel">
    <h2>🌲 Receipt Generator</h2>
    
    <div class="form-group">
      <label>Order Number</label>
      <input type="text" id="orderNo" value="#1001" oninput="updateReceipt()">
    </div>
    
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="orderDate" oninput="updateReceipt()">
    </div>

    <div class="form-group">
      <label>Select Custom Theme</label>
      <select id="themePicker" onchange="updateReceipt()">
        <option value="theme-sage">🌿 Sage Forest Gingham</option>
        <option value="theme-pink">🎀 Coquette Pink Bow</option>
        <option value="theme-doodle">✨ Monochrome Doodle</option>
      </select>
    </div>

    <div class="form-group">
      <label>Items</label>
      <div id="itemList">
        <div class="item-row">
          <input type="text" class="item-name" value="Jake Dog" placeholder="Item" oninput="updateReceipt()">
          <input type="number" class="item-qty" value="1" min="1" placeholder="Qty" oninput="updateReceipt()">
          <input type="number" class="item-price" value="7000" placeholder="Price" oninput="updateReceipt()">
          <button class="btn-delete" onclick="removeItemRow(this)">✕</button>
        </div>
      </div>
      <button class="btn-secondary" onclick="addItemRow()">+ Add Item</button>
    </div>

    <button class="btn-main" onclick="downloadReceipt()">Save Crisp Image</button>
  </div>

  <div class="receipt-wrapper">
    <div class="receipt-ticket theme-sage" id="receiptTicket">
      <div>
        <div class="receipt-title" id="dispTitle">RECEIPT</div>
        <div class="receipt-header-info">
          <span>ORDER: <strong id="dispOrderNo">#1001</strong></span>
          <span>DATE: <strong id="dispDate">2026-08-29</strong></span>
        </div>

        <table class="receipt-table">
          <thead>
            <tr>
              <th style="width: 50%;">ITEM</th>
              <th class="num" style="width: 20%;">QTY</th>
              <th class="num" style="width: 30%;">PRICE</th>
            </tr>
          </thead>
          <tbody id="dispItems">
          </tbody>
        </table>
      </div>

      <div>
        <div class="receipt-total-box">
          <span>TOTAL:</span>
          <span id="dispTotal">0</span>
        </div>
        <div class="receipt-footer-text">
          ✨ Handmade with love in the woods ✨
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('orderDate').valueAsDate = new Date();

    function addItemRow() {
      const container = document.getElementById('itemList');
      const div = document.createElement('div');
      div.className = 'item-row';
      div.innerHTML = `
        <input type="text" class="item-name" placeholder="Item" oninput="updateReceipt()">
        <input type="number" class="item-qty" value="1" min="1" placeholder="Qty" oninput="updateReceipt()">
        <input type="number" class="item-price" placeholder="Price" oninput="updateReceipt()">
        <button class="btn-delete" onclick="removeItemRow(this)">✕</button>
      `;
      container.appendChild(div);
      updateReceipt();
    }

    function removeItemRow(btn) {
      btn.parentElement.remove();
      updateReceipt();
    }

    function updateReceipt() {
      const ticket = document.getElementById('receiptTicket');
      const selectedTheme = document.getElementById('themePicker').value;
      
      // Update theme classes
      ticket.className = `receipt-ticket ${selectedTheme}`;

      // Update header details
      document.getElementById('dispOrderNo').innerText = document.getElementById('orderNo').value;
      document.getElementById('dispDate').innerText = document.getElementById('orderDate').value;

      // Calculate totals
      const names = document.querySelectorAll('.item-name');
      const qtys = document.querySelectorAll('.item-qty');
      const prices = document.querySelectorAll('.item-price');
      
      const tbody = document.getElementById('dispItems');
      tbody.innerHTML = '';
      let total = 0;

      for (let i = 0; i < names.length; i++) {
        const name = names[i].value || '';
        const qty = parseInt(qtys[i].value) || 0;
        const price = parseFloat(prices[i].value) || 0;
        const lineTotal = qty * price;
        total += lineTotal;

        if (name) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${name}</td>
            <td class="num">${qty}</td>
            <td class="num">${lineTotal.toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        }
      }

      document.getElementById('dispTotal').innerText = total.toLocaleString();
    }

    function downloadReceipt() {
      const ticket = document.getElementById('receiptTicket');
      html2canvas(ticket, {
        scale: 3
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `receipt-${document.getElementById('orderNo').value}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    updateReceipt();
  </script>
</body>
</html>
