<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Receipt Generator</title>
  <!-- Library to convert DOM element to Canvas/Image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #f2f5f3;
      --panel-bg: #ffffff;
      --accent-color: #768a76;
      --text-color: #3b473b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* Control Panel */
    .controls-panel {
      background: var(--panel-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 340px;
    }

    .controls-panel h2 {
      margin-top: 0;
      color: var(--accent-color);
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .item-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }

    .item-row input[type="text"] { flex: 2; }
    .item-row input[type="number"] { flex: 1; }

    .btn-delete {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button.btn-main {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 10px;
    }

    button.btn-secondary {
      background: #e2e8e2;
      color: var(--text-color);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 5px;
    }

    /* Receipt Canvas Display */
    .receipt-ticket {
      width: 360px;
      height: 640px;
      background-color: #fff;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 12px;
      padding: 130px 30px 40px 30px;
      box-sizing: border-box;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      font-family: 'Courier New', Courier, monospace;
      color: #3d4a3d;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .receipt-header {
      text-align: center;
      font-size: 0.85rem;
      border-bottom: 1px dashed #768a76;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .receipt-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .receipt-table th {
      text-align: left;
      border-bottom: 1px dashed #768a76;
      padding-bottom: 5px;
    }

    .receipt-table td {
      padding: 6px 0;
    }

    .receipt-table .num {
      text-align: right;
    }

    .receipt-total {
      border-top: 1px dashed #768a76;
      margin-top: 15px;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 1rem;
    }

    .receipt-footer {
      text-align: center;
      font-size: 0.75rem;
      margin-top: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <h2>🌲 Receipt Builder</h2>
    
    <div class="form-group">
      <label>Order Number</label>
      <input type="text" id="orderNo" value="#1001" oninput="updateReceipt()">
    </div>
    
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="orderDate" oninput="updateReceipt()">
    </div>

    <div class="form-group">
      <label>Background Aesthetic</label>
      <select id="bgPicker" onchange="updateReceipt()">
        <option value="59902.jpg">Sage Green Bows (Gingham)</option>
        <option value="59901.jpg">Coquette Pink Bows</option>
        <option value="59903.jpg">Blossom Cafe</option>
      </select>
    </div>

    <div class="form-group">
      <label>Items</label>
      <div id="itemList">
        <div class="item-row">
          <input type="text" class="item-name" value="Jake the Dog" placeholder="Item" oninput="updateReceipt()">
          <input type="number" class="item-qty" value="1" min="1" placeholder="Qty" oninput="updateReceipt()">
          <input type="number" class="item-price" value="7000" placeholder="Price" oninput="updateReceipt()">
          <button class="btn-delete" onclick="removeItemRow(this)">✕</button>
        </div>
      </div>
      <button class="btn-secondary" onclick="addItemRow()">+ Add Item</button>
    </div>

    <button class="btn-main" onclick="downloadReceipt()">Save Receipt Image</button>
  </div>

  <!-- Receipt Canvas Output -->
  <div class="receipt-ticket" id="receiptTicket">
    <div>
      <div class="receipt-header">
        <div>ORDER: <span id="dispOrderNo">#1001</span></div>
        <div>DATE: <span id="dispDate">2026-08-29</span></div>
      </div>

      <table class="receipt-table">
        <thead>
          <tr>
            <th>ITEM</th>
            <th class="num">QTY</th>
            <th class="num">PRICE</th>
          </tr>
        </thead>
        <tbody id="dispItems">
        </tbody>
      </table>
    </div>

    <div>
      <div class="receipt-total">
        <span>TOTAL:</span>
        <span id="dispTotal">0</span>
      </div>
      <div class="receipt-footer">
        ✨ Handmade with love in the woods ✨
      </div>
    </div>
  </div>

  <script>
    document.getElementById('orderDate').valueAsDate = new Date();

    function addItemRow() {
      const container = document.getElementById('itemList');
      const div = document.createElement('div');
      div.className = 'item-row';
      div.innerHTML = `
        <input type="text" class="item-name" placeholder="Item" oninput="updateReceipt()">
        <input type="number" class="item-qty" value="1" min="1" placeholder="Qty" oninput="updateReceipt()">
        <input type="number" class="item-price" placeholder="Price" oninput="updateReceipt()">
        <button class="btn-delete" onclick="removeItemRow(this)">✕</button>
      `;
      container.appendChild(div);
      updateReceipt();
    }

    function removeItemRow(btn) {
      const row = btn.parentElement;
      row.remove();
      updateReceipt();
    }

    function updateReceipt() {
      // Background Switch
      const picker = document.getElementById('bgPicker').value;
      document.getElementById('receiptTicket').style.backgroundImage = `url('${picker}')`;

      // Header values
      document.getElementById('dispOrderNo').innerText = document.getElementById('orderNo').value;
      document.getElementById('dispDate').innerText = document.getElementById('orderDate').value;

      // Table & Totals calculation
      const names = document.querySelectorAll('.item-name');
      const qtys = document.querySelectorAll('.item-qty');
      const prices = document.querySelectorAll('.item-price');
      
      const tbody = document.getElementById('dispItems');
      tbody.innerHTML = '';
      let total = 0;

      for (let i = 0; i < names.length; i++) {
        const name = names[i].value || 'Item';
        const qty = parseInt(qtys[i].value) || 0;
        const price = parseFloat(prices[i].value) || 0;
        const itemTotal = qty * price;
        total += itemTotal;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${name}</td>
          <td class="num">${qty}</td>
          <td class="num">${itemTotal.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      }

      document.getElementById('dispTotal').innerText = total.toLocaleString();
    }

    function downloadReceipt() {
      const ticket = document.getElementById('receiptTicket');
      html2canvas(ticket, {
        useCORS: true,
        scale: 2
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `receipt-${document.getElementById('orderNo').value}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    updateReceipt();
  </script>
</body>
</html>
